buildscript {
    repositories {
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        maven { name = 'SpongePowered'; url = 'https://repo.spongepowered.org/repository/maven-public' }
        maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    }
    dependencies {
        classpath "org.spongepowered:mixingradle:${mixingradle_version}"
        classpath "org.parchmentmc:librarian:${librarian_version}"
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'
apply plugin: 'org.parchmentmc.librarian.forgegradle'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Official (Mojang) mappings with Parchment parameter names on top, so the
    // 1.20.1 sources stay readable while porting from 1.21.1.
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    // Access transformers are picked up automatically from this location.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', "${mod_id}", '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenLocal()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    flatDir {
        // Local jars for mods that are not published to any maven (e.g. Mob Weapon API)
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor: writes the refmap used by the production jar.
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    // GeckoLib - required by Modular Golems
    compileOnly fg.deobf("curse.maven:geckolib-388172:8285794")
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:8285794")

    // L2 Library - required by Modular Golems
    compileOnly fg.deobf("curse.maven:l2library-620203:9142545")
    runtimeOnly fg.deobf("curse.maven:l2library-620203:9142545")

    // Mob Weapon API - loaded from ./libs, also bundled by Modular Golems at runtime
    compileOnly fg.deobf("dev.xkmc.mob_weapon_api:mob_weapon_api:${mob_weapon_api_version}")

    // Modular Golems
    compileOnly fg.deobf("curse.maven:modulargolems-690937:9266489")
    runtimeOnly fg.deobf("curse.maven:modulargolems-690937:9266489")

    // Iron's Lib
    compileOnly fg.deobf("curse.maven:irons-lib-1492763:9003169")
    runtimeOnly fg.deobf("curse.maven:irons-lib-1492763:9003169")

    // Iron's Arms 'n Artifice
    compileOnly fg.deobf("curse.maven:irons-artifice-1650193:9277463")
    runtimeOnly fg.deobf("curse.maven:irons-artifice-1650193:9277463")

    // optional
    runtimeOnly fg.deobf("curse.maven:l2-backpack-620229:8137699")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Expand the version placeholders used in META-INF/mods.toml and pack.mcmeta
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version,
                             forge_version_range    : forge_version_range,
                             mg_version_range       : mg_version_range,
                             ia_version_range       : ia_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                // Required on Forge so that FML loads our mixin config
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    // ForgeGradle: remap the compiled classes back to SRG names for production
    finalizedBy 'reobfJar'
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
